name: personal-gemini-journal

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: journal_bootstrap
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-journal}
      APP_DB_USER: ${POSTGRES_USER:-journal_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - journal-postgres:/var/lib/postgresql/data
      - ./infra/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_bootstrap -d ${POSTGRES_DB:-journal}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.local}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak/journal-realm.json:/opt/keycloak/data/import/journal-realm.json:ro
      - journal-keycloak:/opt/keycloak/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - journal-ollama:/root/.ollama
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_GENERATION_PROVIDER: ${AI_GENERATION_PROVIDER:-ollama}
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ \"${AI_GENERATION_PROVIDER:-ollama}\" = \"ollama\" ]; then sleep 5; ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}; ollama pull ${OLLAMA_CHAT_MODEL:-gemma3:1b}; fi"]
    depends_on:
      - ollama
    restart: "no"

  backend:
    build: ./personal-gemini-journal-backend
    environment:
      SPRING_PROFILES_ACTIVE: local,${AI_GENERATION_PROVIDER:-ollama}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-journal}
      POSTGRES_USER: ${POSTGRES_USER:-journal_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      OIDC_ISSUER_URI: http://localhost:8180/realms/journal
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/journal/protocol/openid-connect/certs
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      JOURNAL_WRITES_PER_HOUR: ${JOURNAL_WRITES_PER_HOUR:-30}
      RAG_QUERIES_PER_HOUR: ${RAG_QUERIES_PER_HOUR:-20}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}
      LOCATION_PINS_PER_HOUR: ${LOCATION_PINS_PER_HOUR:-12}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-13000},http://localhost:3000,http://localhost:5173
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./personal-gemini-journal-frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-18080}
        VITE_AUTH_MODE: oidc
        VITE_OIDC_URL: http://localhost:8180
        VITE_OIDC_REALM: journal
        VITE_OIDC_CLIENT_ID: journal-web
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  journal-postgres:
  journal-keycloak:
  journal-ollama:
