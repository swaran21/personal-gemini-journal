spring.application.name=personal-gemini-journal-backend
spring.profiles.default=local
server.port=${PORT:8080}

app.rate-limit.journal-writes-per-hour=${JOURNAL_WRITES_PER_HOUR:30}
app.rate-limit.rag-queries-per-hour=${RAG_QUERIES_PER_HOUR:20}
app.rate-limit.api-requests-per-minute=${API_REQUESTS_PER_MINUTE:120}
server.forward-headers-strategy=framework
server.error.include-message=never
server.servlet.session.cookie.secure=true
server.max-http-request-header-size=16KB
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
