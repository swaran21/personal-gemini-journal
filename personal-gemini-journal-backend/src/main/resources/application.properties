spring.application.name=personal-gemini-journal-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Cloud Run supplies project credentials through its service account. The API key value itself is
# read only from Secret Manager; set GEMINI_API_KEY_SECRET to a secret resource name/version.
app.gemini.api-key-secret=${GEMINI_API_KEY_SECRET}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.google-cloud.project-id=${GOOGLE_CLOUD_PROJECT}
app.google-cloud.firestore-database-id=${FIRESTORE_DATABASE_ID}
