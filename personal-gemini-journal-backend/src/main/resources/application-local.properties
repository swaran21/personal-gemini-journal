spring.config.activate.on-profile=local

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/journal}
spring.datasource.username=${POSTGRES_USER:journal_app}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.auto-commit=false
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

app.security.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/journal}
app.security.oidc.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/journal/protocol/openid-connect/certs}
app.security.oidc.audience=${OIDC_AUDIENCE:journal-web}

app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.chat-model=${OLLAMA_CHAT_MODEL:gemma3:1b}
app.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.ollama.embedding-dimensions=${OLLAMA_EMBEDDING_DIMENSIONS:768}

app.accountability.poll-delay-ms=${ACCOUNTABILITY_POLL_DELAY_MS:2000}
app.accountability.initial-delay-ms=${ACCOUNTABILITY_INITIAL_DELAY_MS:2000}
app.accountability.batch-size=${ACCOUNTABILITY_BATCH_SIZE:5}
app.accountability.max-attempts=${ACCOUNTABILITY_MAX_ATTEMPTS:5}
